<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Boceto de referencia: HTML estático con datos de ejemplo, no es código de producción -->
<title>Cierre de sesión</title>

</head>
<body>


<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;800&amp;family=Source+Sans+3:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#4F7A0F}a:hover{color:#1C1E1A}
.h{font-family:'Barlow Condensed',sans-serif;font-weight:800;text-transform:uppercase;line-height:.95;margin:0}
.h em{font-style:normal;background:#7CB518;padding:0 .08em}
.card{background:#FFFFFF;border:2px solid #E6E1D6;border-radius:16px;padding:16px}
.lbl{font-size:14px;font-weight:700;color:#5E615A}
.btn{display:flex;align-items:center;justify-content:center;min-height:56px;border-radius:14px;background:#7CB518;color:#1C1E1A;font-weight:700;font-size:18px;border:0;font-family:'Source Sans 3',sans-serif;text-decoration:none}
.btn2{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;background:#FFFFFF;color:#1C1E1A;font-weight:700;font-size:17px;border:2px solid #1C1E1A;font-family:'Source Sans 3',sans-serif;text-decoration:none}
.est{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:700}
</style>

<div style="width: 390px; height: 844px; background: #FAF7F0; color: #1C1E1A; font-family: 'Source Sans 3', sans-serif; font-size: 16px; line-height: 1.4; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid #E6E1D6">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px"><span style="background: #1C1E1A; color: #FAF7F0; border-radius: 6px; padding: 1px 5px"><span style="color: #7CB518">+</span>1</span> UN KILO MÁS</div>
<button type="button" aria-label="Menú" style="width: 44px; height: 44px; border: 0; background: none"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M3 6h16M3 11h16M3 16h16" stroke="#1C1E1A" stroke-width="2.5" stroke-linecap="round"/></svg></button>
</header>
<div style="height: 6px; background: #7CB518"></div>
<section style="padding: 20px; display: flex; flex-direction: column; gap: 14px">
<div class="lbl">Día A · semana 2 · 68 min</div>
<h1 class="h" style="font-size: 44px">Sesión <em>terminada</em></h1>
<div class="card">
<div class="lbl" style="margin-bottom: 6px">Frente a la vez anterior</div>
<div style="display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #E6E1D6"><span>Sentadilla</span><b>90 → 92.5 kg × 6 <span style="color: #4F7A0F">+2.5</span></b></div>
<div style="display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #E6E1D6"><span>Press banca</span><b>60 kg × 6 · igual</b></div>
<div style="display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid #E6E1D6"><span>Peso muerto rumano</span><b>70 → 72.5 kg × 7 <span style="color: #4F7A0F">+2.5</span></b></div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-weight: 700">¿Algo que deba saber tu entrenador?
<textarea rows="4" placeholder="Por ejemplo: me molestó la rodilla, la última serie salió fácil…" style="border: 2px solid #CFC9BB; border-radius: 12px; padding: 12px; font-size: 16px; font-family: inherit; resize: vertical"></textarea></label>
<div style="font-size: 13px; color: #5E615A">Opcional. Lo ve en tu ficha.</div>
<button class="btn" type="button">Guardar y terminar</button>
</section>

</div>


</body>
</html>
